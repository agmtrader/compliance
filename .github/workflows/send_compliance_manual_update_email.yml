name: Send Compliance Manual Update Email

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'controls/**'
      - 'processes/**'
      - '**/*.md'
      - '**/*.csv'

jobs:
  notify-compliance-update:
    runs-on: ubuntu-latest
    steps:
      - name: Call compliance email endpoint
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"token":"all"}' \
            https://api.agmtechnology.com/token)

          http_status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_status" != "200" ]; then
            echo "::warning::Token request failed with status $http_status. Skipping compliance email notification."
            echo "$body"
            exit 0
          fi

          access_token=$(echo "$body" | jq -r '.access_token')
          if [ "$access_token" = "null" ] || [ -z "$access_token" ]; then
            echo "::warning::access_token not found in response. Skipping compliance email notification."
            echo "$body"
            exit 0
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $access_token" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg pr_url "$PR_URL" \
              --arg pr_title "$PR_TITLE" \
              --arg commit_sha "$COMMIT_SHA" \
              --arg repository "$REPOSITORY" \
              '{pr_url: (if $pr_url == "" then null else $pr_url end), pr_title: (if $pr_title == "" then null else $pr_title end), commit_sha: $commit_sha, repository: $repository}')" \
            https://api.agmtechnology.com/actions/send_compliance_manual_update_email)

          http_status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_status" != "200" ]; then
            echo "::warning::Compliance update email endpoint failed with status $http_status. Notification was not sent."
            echo "$body"
            exit 0
          fi

          echo "$body"
